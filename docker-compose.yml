# Tous les ports sont publiés sur 127.0.0.1 uniquement (ADR-0008 : pas d'authentification).
name: happly-ai

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      HAPPLY_ENVIRONMENT: ${HAPPLY_ENVIRONMENT:-development}
      HAPPLY_CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:3000"]'
      HAPPLY_LOG_LEVEL: ${HAPPLY_LOG_LEVEL:-INFO}
      HAPPLY_STORAGE_DIR: /srv/storage
      HAPPLY_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # IA (facultative). Vide = fournisseur non configuré ; les secrets viennent de .env.
      HAPPLY_GEMINI_API_KEY: ${HAPPLY_GEMINI_API_KEY:-}
      HAPPLY_GEMINI_TIER: ${HAPPLY_GEMINI_TIER:-free}
      HAPPLY_GEMINI_MODEL_LEVEL1: ${HAPPLY_GEMINI_MODEL_LEVEL1:-gemini-3.1-flash-lite}
      HAPPLY_GEMINI_MODEL_LEVEL2: ${HAPPLY_GEMINI_MODEL_LEVEL2:-gemini-3-flash-preview}
      HAPPLY_GEMINI_THINKING_LEVEL: ${HAPPLY_GEMINI_THINKING_LEVEL:-minimal}
      HAPPLY_OLLAMA_ENABLED: ${HAPPLY_OLLAMA_ENABLED:-false}
      # Ollama tourne sur la machine hôte (pas dans le conteneur).
      HAPPLY_OLLAMA_URL: ${HAPPLY_OLLAMA_URL:-http://host.docker.internal:11434}
      HAPPLY_OLLAMA_MODEL_LEVEL1: ${HAPPLY_OLLAMA_MODEL_LEVEL1:-gemma4:e4b}
      HAPPLY_OLLAMA_MODEL_LEVEL2: ${HAPPLY_OLLAMA_MODEL_LEVEL2:-gemma4:12b}
    volumes:
      # Sans ce volume, les PDF générés disparaîtraient à chaque recréation du conteneur.
      - documents_data:/srv/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - /srv/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  documents_data:
