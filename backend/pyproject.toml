[project]
name = "happly-api"
version = "0.1.0"
description = "API Happly AI — monolithe modulaire en Clean Architecture"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=4.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Fichiers générés par Alembic : seules les corrections automatiques de formatage s'appliquent.
"migrations/versions/*" = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
