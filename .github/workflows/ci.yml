name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: happly_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: happly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U happly_test -d happly_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      HAPPLY_TEST_DATABASE_URL: postgresql://happly_test:test-only@127.0.0.1:5432/happly_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Le registre des tâches doit refléter le backlog maître (le maître fait foi).
      - run: uv run python tools/sync_backlog_registry.py --check
      # pdfLaTeX est indispensable aux tests de compilation réelle (EPIC 012/013).
      - name: Installer TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
      # Seuil sous la valeur mesurée (94,6 % le 2026-11-04) : détecte une régression de couverture.
      - run: uv run pytest --cov=app --cov-fail-under=92
        env:
          # Un test de compilation ne doit jamais être ignoré en silence en CI.
          HAPPLY_REQUIRE_PDFLATEX: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
