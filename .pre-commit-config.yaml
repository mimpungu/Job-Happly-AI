# Installation (une fois) : cd backend && uv run pre-commit install --config ../.pre-commit-config.yaml
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv --directory backend run ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv --directory backend run ruff check
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv --directory backend run mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: web-format-check
        name: prettier
        entry: pnpm --dir frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: web-lint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: web-typecheck
        name: tsc
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
